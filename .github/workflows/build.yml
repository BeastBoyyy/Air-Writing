# Builds the Windows portable .exe and the macOS universal .app (zip) on every v* tag, or on demand.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # make sure the Electron binary and MediaPipe assets are present even if install scripts were skipped
      - run: node node_modules/electron/install.js && node scripts/setup-assets.mjs
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: air-writing-pro-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
